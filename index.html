<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Companion Character Lab</title>
<style>
:root{font-family:Inter,"SF Pro Display","PingFang SC",sans-serif;color:#161719;background:#f4f5f6;line-height:1.4}
*{box-sizing:border-box;letter-spacing:0!important}body{margin:0;min-width:320px}button,input{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr) 270px;transition:background .2s,color .2s}
.rail{background:#fff;border-right:1px solid #e1e3e6;padding:22px 16px;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand-icon{width:28px;height:28px;flex:none}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#92979e;font-weight:700;margin:0 0 9px}.state-list{display:grid;gap:3px}.state-list button{border:0;background:transparent;text-align:left;color:#676c73;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}.state-list button:hover{background:#f1f2f4}.state-list button[aria-pressed=true]{background:#17191c;color:#fff;font-weight:650}
.rail-note{margin-top:auto;font-size:11px;color:#9a9ea4}.main{min-width:0;display:flex;flex-direction:column}.topbar{height:72px;background:#fff;border-bottom:1px solid #e1e3e6;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.topbar h1{font-size:15px;margin:0;font-weight:700}.topbar p{font-size:12px;color:#8b9096;margin:4px 0 0}.top-actions{display:flex;gap:8px}.btn{border:1px solid #dfe2e5;background:#fff;border-radius:6px;padding:7px 11px;color:#4d5258;cursor:pointer;font-size:12px}.btn:hover{border-color:#aeb3b9}.btn.primary{background:#17191c;color:#fff;border-color:#17191c}
.workspace{flex:1;display:grid;place-items:center;padding:42px 32px;transition:background .2s}.workspace.surface-dark{background:#0f1114}.stage{width:min(100%,620px);aspect-ratio:1/.82;display:grid;place-items:center;position:relative;transition:background .2s}.stage.surface-dark{background:#0f1114}.stage svg{width:min(64%,390px);height:auto;position:relative;z-index:1}.stage-meta{position:absolute;bottom:18px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:end;font-size:11px;color:#a0a4aa;z-index:2}.stage-meta strong{display:block;color:#3a3e43;font-size:13px;margin-top:3px}.stage.surface-dark .stage-meta strong{color:#e8eaec}.status-dot{width:7px;height:7px;border-radius:50%;background:#65c7a2;display:inline-block;margin-right:5px}
.inspector{background:#fff;border-left:1px solid #e1e3e6;padding:22px 18px}.panel{border-bottom:1px solid #e7e8ea;padding-bottom:22px;margin-bottom:22px}.panel:last-child{border-bottom:0}.panel h2{font-size:12px;margin:0 0 14px}.choice-row{display:flex;gap:5px}.choice-row button{flex:1;border:1px solid #e0e2e5;background:#fff;color:#777c82;padding:7px 4px;border-radius:5px;font-size:11px;cursor:pointer}.choice-row button[aria-pressed=true]{background:#eff1f3;color:#141619;border-color:#aeb3b9;font-weight:650}.range{width:100%;accent-color:#17191c}.field{display:flex;justify-content:space-between;align-items:center;margin:13px 0;font-size:12px;color:#686d74}.field output{font-variant-numeric:tabular-nums;color:#17191c}.switch{position:relative;width:34px;height:19px;border-radius:20px;border:0;background:#d7d9dc;padding:0;cursor:pointer}.switch:after{content:"";position:absolute;top:3px;left:3px;width:13px;height:13px;border-radius:50%;background:#fff;transition:transform .16s}.switch[aria-pressed=true]{background:#17191c}.switch[aria-pressed=true]:after{transform:translateX(15px)}
.mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mini{border:1px solid #e2e4e7;border-radius:6px;background:#fafafa;padding:4px;cursor:pointer}.mini[aria-pressed=true]{border-color:#17191c;background:#f0f1f2}.mini svg{width:100%;display:block}.mini span{font-size:10px;color:#83878c}
.surface{display:flex;align-items:center;justify-content:space-between;margin-top:14px;font-size:12px;color:#686d74}.surface .choice-row{width:132px}
@media(max-width:980px){.app{grid-template-columns:190px minmax(0,1fr)}.inspector{grid-column:1/-1;border-left:0;border-top:1px solid #e1e3e6;display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.panel{border-bottom:0;margin:0;padding:0}}
@media(max-width:640px){.app{display:block}.rail{border-right:0;border-bottom:1px solid #e1e3e6;padding:14px 16px}.brand{margin-bottom:10px}.state-list{display:flex;overflow:auto;padding-bottom:2px}.state-list button{white-space:nowrap}.rail-note{display:none}.topbar{height:auto;padding:16px;gap:12px}.top-actions{flex-wrap:wrap;justify-content:flex-end}.workspace{padding:16px}.stage{aspect-ratio:1/.95}.stage svg{width:72%}.inspector{display:block;padding:18px 16px}.panel{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid #e7e8ea}}
/* Keep the character within a stable square while the stage stays open. */
.stage>svg{max-width:80%;max-height:80%;aspect-ratio:1}
button:focus-visible,input:focus-visible{outline:2px solid #16836d;outline-offset:3px}
button:disabled{opacity:.4;cursor:not-allowed}
.rail{gap:22px}
@media(max-width:640px){.rail{gap:0}.eyebrow{display:none}.stage{min-height:300px}.stage>svg{width:min(72%,280px)}.topbar h1{font-size:14px}.state-list button{padding:8px 12px}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><svg class="brand-icon" aria-hidden="true"></svg><span>Character Lab</span></div>
    <div><p class="eyebrow">States</p><div class="state-list" id="states"></div></div>
    <p class="rail-note">Companion v0.4 · SVG motion study</p>
  </aside>
  <main class="main">
    <header class="topbar"><div><h1>Companion character</h1></div><div class="top-actions"><button class="btn" id="reset" title="Reset preview">复位</button><button class="btn" id="pause" aria-pressed="false">暂停</button><button class="btn primary" id="play">跳一下</button></div></header>
    <section class="workspace" id="workspace"><div class="stage" id="stage"><svg id="companion"></svg><div class="stage-meta"><div><span class="status-dot"></span><span id="playback-status">LIVE</span><strong id="state-label">安静</strong></div><div id="size-label">280px</div></div></div></section>
  </main>
  <aside class="inspector">
    <section class="panel"><h2>Render quality</h2><div class="choice-row" id="quality"><button data-quality="minimal">Minimal</button><button data-quality="balanced">Balanced</button><button data-quality="rich" aria-pressed="true">Rich</button></div></section>
    <section class="panel"><h2>Motion</h2><div class="field"><span>Pointer gaze</span><button class="switch" id="follow" aria-pressed="true" aria-label="Pointer gaze"></button></div><div class="field"><span>Reduced motion</span><button class="switch" id="reduced" aria-pressed="false" aria-label="Reduced motion"></button></div><div class="field"><label for="intensity">Intensity</label><output id="intensity-value" for="intensity">62%</output></div><input class="range" id="intensity" type="range" min="0" max="100" value="62"><div class="surface"><span>Surface</span><div class="choice-row" id="surface"><button data-surface="light" aria-pressed="true">Light</button><button data-surface="dark">Dark</button></div></div></section>
    <section class="panel"><h2>Preview sizes</h2><div class="mini-grid" id="sizes"><button class="mini" data-size="64"><svg viewBox="0 0 256 256"><path d="M57 112C51 92 43 48 48 35C52 24 86 44 112 66L142 66C163 46 192 28 198 36C204 47 197 94 191 113L202 187C200 215 180 225 133 225C86 225 55 216 50 192C46 171 53 145 52 119Z" fill="#151719"/><circle cx="91" cy="133" r="13" fill="#fff"/><circle cx="160" cy="133" r="13" fill="#fff"/></svg><span>64px</span></button><button class="mini" data-size="160"><svg viewBox="0 0 256 256"><path d="M57 112C51 92 43 48 48 35C52 24 86 44 112 66L142 66C163 46 192 28 198 36C204 47 197 94 191 113L202 187C200 215 180 225 133 225C86 225 55 216 50 192C46 171 53 145 52 119Z" fill="#151719"/><circle cx="91" cy="133" r="13" fill="#fff"/><circle cx="160" cy="133" r="13" fill="#fff"/></svg><span>160px</span></button><button class="mini" data-size="280" aria-pressed="true"><svg viewBox="0 0 256 256"><path d="M57 112C51 92 43 48 48 35C52 24 86 44 112 66L142 66C163 46 192 28 198 36C204 47 197 94 191 113L202 187C200 215 180 225 133 225C86 225 55 216 50 192C46 171 53 145 52 119Z" fill="#151719"/><circle cx="91" cy="133" r="13" fill="#fff"/><circle cx="160" cy="133" r="13" fill="#fff"/></svg><span>280px</span></button></div></section>
    <section class="panel"><button class="btn" id="export">导出当前 SVG</button></section>
  </aside>
</div>
<script src="src/math.js"></script><script src="src/presets.js"></script><script src="src/material.js"></script><script src="src/character.js"></script>
<script>
const bot = new Companion(document.getElementById("companion"), { state: "idle", size: 280, quality: "rich", intensity: 0.62 });
const thumbnails = [...document.querySelectorAll(".mini svg, .brand-icon")].map(svg =>
  new Companion(svg, { size: svg.classList.contains("brand-icon") ? 28 : 56, static: true, quality: "minimal" }));
const $ = id => document.getElementById(id);
const motionPreference = matchMedia("(prefers-reduced-motion: reduce)");
const initial = { state: "idle", size: 280, intensity: 0.62, quality: "rich", surface: "light" };
const stage = $("stage");
const workspace = $("workspace");
function syncControls() {
  $("pause").textContent = bot.paused ? "继续" : "暂停";
  $("pause").setAttribute("aria-pressed", bot.paused);
  $("reduced").setAttribute("aria-pressed", bot.reduced);
  $("reduced").disabled = motionPreference.matches;
  $("play").disabled = bot.paused || bot.reduced || bot.state === "sleeping" || bot.intensity === 0;
  $("follow").disabled = bot.reduced;
  $("intensity").disabled = bot.reduced;
  $("playback-status").textContent = bot.reduced ? "STILL" : bot.paused ? "PAUSED" : "LIVE";
  stage.dataset.surface = bot.surface;
  stage.classList.toggle("surface-dark", bot.surface === "dark");
  workspace.classList.toggle("surface-dark", bot.surface === "dark");
}
Object.entries(COMPANION_PRESETS.states).forEach(([id, preset]) => {
  const button = document.createElement("button");
  button.textContent = preset.label;
  button.dataset.state = id;
  button.setAttribute("aria-pressed", id === "idle");
  button.onclick = () => {
    bot.setState(id);
    thumbnails.forEach(item => item.setState(id));
    $("state-label").textContent = preset.label;
    $("states").querySelectorAll("button").forEach(item => item.setAttribute("aria-pressed", item === button));
    syncControls();
  };
  $("states").appendChild(button);
});
$("pause").onclick = () => { bot.setPaused(!bot.paused); syncControls(); };
$("play").onclick = () => bot.play("bounce");
$("reset").onclick = () => {
  bot.setPaused(false);
  bot.setState(initial.state, true);
  bot.setSize(initial.size);
  bot.setIntensity(initial.intensity);
  bot.setQuality(initial.quality);
  bot.setSurface(initial.surface);
  thumbnails.forEach(item => item.setState(initial.state, true));
  $("state-label").textContent = COMPANION_PRESETS.states.idle.label;
  $("size-label").textContent = "280px";
  $("intensity").value = 62;
  $("intensity-value").textContent = "62%";
  $("states").querySelectorAll("button").forEach(item => item.setAttribute("aria-pressed", item.dataset.state === "idle"));
  document.querySelectorAll("[data-quality]").forEach(item => item.setAttribute("aria-pressed", item.dataset.quality === "rich"));
  document.querySelectorAll("[data-size]").forEach(item => item.setAttribute("aria-pressed", item.dataset.size === "280"));
  document.querySelectorAll("[data-surface]").forEach(item => item.setAttribute("aria-pressed", item.dataset.surface === "light"));
  syncControls();
};
$("follow").onclick = () => {
  bot.setFollowPointer(!bot.followPointer);
  $("follow").setAttribute("aria-pressed", bot.followPointer);
};
$("reduced").onclick = () => { bot.setReducedMotion(!bot.requestedReduced); syncControls(); };
$("intensity").oninput = event => {
  $("intensity-value").textContent = event.target.value + "%";
  bot.setIntensity(event.target.value / 100);
  syncControls();
};
document.querySelectorAll("[data-quality]").forEach(button => button.onclick = () => {
  bot.setQuality(button.dataset.quality);
  document.querySelectorAll("[data-quality]").forEach(item => item.setAttribute("aria-pressed", item === button));
});
document.querySelectorAll("[data-size]").forEach(button => button.onclick = () => {
  bot.setSize(button.dataset.size);
  $("size-label").textContent = bot.size + "px";
  document.querySelectorAll("[data-size]").forEach(item => item.setAttribute("aria-pressed", item === button));
});
document.querySelectorAll("[data-surface]").forEach(button => button.onclick = () => {
  bot.setSurface(button.dataset.surface);
  document.querySelectorAll("[data-surface]").forEach(item => item.setAttribute("aria-pressed", item === button));
  syncControls();
});
$("export").onclick = () => {
  const blob = new Blob([bot.exportSVG()], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `companion-${bot.state}-${bot.size}px.svg`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 0);
};
motionPreference.addEventListener("change", syncControls);
syncControls();
window.addEventListener("pagehide", event => {
  if (event.persisted) return;
  bot.destroy();
  thumbnails.forEach(item => item.destroy());
  motionPreference.removeEventListener("change", syncControls);
});
</script>
</body>
</html>
